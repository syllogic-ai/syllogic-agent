name: AI Commit Summarizer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Commit Summarizer
        uses: actions/github-script@v7
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // Use OpenAI API for intelligent summarization
            const openai = require('openai');
            const client = new openai.OpenAI({
              apiKey: process.env.OPENAI_API_KEY
            });

            const commitMessages = commits.map(c => c.commit.message).join('\n');
            const fileChanges = files.map(f => `${f.filename}: +${f.additions} -${f.deletions}`).join('\n');

            const prompt = `Summarize this pull request:
            
            Commits:
            ${commitMessages}
            
            File Changes:
            ${fileChanges}
            
            Provide a concise summary of what this PR accomplishes.`;

            const response = await client.chat.completions.create({
              model: "gpt-3.5-turbo",
              messages: [{ role: "user", content: prompt }],
              max_tokens: 500
            });

            const summary = response.choices[0].message.content;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 🤖 **AI-Generated Summary**\n\n${summary}`
            });